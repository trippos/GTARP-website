<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Регистрация - GTARP</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<header class="auth-header">
  <a href="index.html" class="auth-logo">GT<span>ARP</span></a>
  <div class="auth-header-links">
    <a href="login.html" class="auth-header-link">Войти</a>
  </div>
</header>

<main class="auth-main">
  <div class="auth-page-inner">
    <div class="auth-card">
      <h1 class="auth-card-title">Регистрация</h1>
      <p class="auth-card-sub">Уже есть аккаунт? <a href="login.html">Войти</a></p>
      <div class="auth-error" id="authError"></div>
      <form onsubmit="handleRegister(event)">
        <div class="auth-form-group">
          <label class="auth-label" for="regUser">Логин</label>
          <input type="text" class="auth-input-field" id="regUser" placeholder="Придумайте логин" required autocomplete="username">
        </div>
        <div class="auth-form-group">
          <label class="auth-label" for="regEmail">Почта</label>
          <input type="email" class="auth-input-field" id="regEmail" placeholder="example@mail.ru" required autocomplete="email">
        </div>
        <div class="auth-form-group">
          <label class="auth-label" for="regPass">Пароль</label>
          <input type="password" class="auth-input-field" id="regPass" placeholder="Минимум 6 символов" required autocomplete="new-password">
        </div>
        <div class="auth-form-group">
          <label class="auth-label" for="regPass2">Повторите пароль</label>
          <input type="password" class="auth-input-field" id="regPass2" placeholder="Повторите пароль" required autocomplete="new-password">
        </div>
        <div class="auth-form-group">
          <label class="auth-label" for="regPromo">Промокод <span style="font-weight:400;color:var(--muted)">(необязательно)</span></label>
          <input type="text" class="auth-input-field" id="regPromo" placeholder="Промокод">
        </div>
        <label class="auth-legal-label">
          <input type="checkbox" required checked>
          <span>Согласен с <a href="#">политикой конфиденциальности</a></span>
        </label>
        <label class="auth-legal-label">
          <input type="checkbox" required checked>
          <span>Согласен с <a href="#">пользовательским соглашением</a></span>
        </label>
        <div class="auth-promo-tip">
          Нет промокода? Используйте <span onclick="applyPromo('gtarpstart')">gtarpstart</span>
        </div>
        <button type="submit" class="auth-action-btn">Зарегистрироваться</button>
      </form>
    </div>
  </div>
</main>

<footer class="auth-footer">© 2024-2026 GTARP</footer>
<script src="auth.js"></script>
</body>
</html>
